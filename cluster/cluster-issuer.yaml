apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bencikdesign@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account-key # cert-manager creates this itself
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
