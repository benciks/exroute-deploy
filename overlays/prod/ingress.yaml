apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exroute-ingress
  labels:
    app.kubernetes.io/name: exroute-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # <namespace>-<middleware name>@kubernetescrd. cert-manager's challenge Ingress doesn't
    # have it, so certificate renewal over HTTP keeps working
    traefik.ingress.kubernetes.io/router.middlewares: exroute-prod-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - exroute.benciks.uk
      secretName: exroute-benciks-uk-tls
  rules:
    - host: "exroute.benciks.uk"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: exroute-web
                port:
                  name: exroute-web
          - pathType: Prefix
            path: "/api"
            backend:
              service:
                name: exroute
                port:
                  name: exroute
