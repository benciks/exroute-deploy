apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
spec:
  selector:
    matchLabels:
      app: valhalla
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: valhalla
          image: ghcr.io/benciks/valhalla:3.9.1-fork.3
          command: ["valhalla_service"]
          args: ["/custom_files/valhalla.json", "1"]
          ports:
            - name: valhalla
              containerPort: 8002
          volumeMounts:
            - name: data
              mountPath: /custom_files
          readinessProbe:
            httpGet:
              path: /status
              port: valhalla
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valhalla-pvc
